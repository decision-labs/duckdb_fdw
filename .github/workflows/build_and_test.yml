name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_profile:
        description: "Test profile for run_tests.sh (core|integration|cloud|all)"
        required: false
        default: "core"

jobs:
  test:
    name: Test on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        pg_version: [15, 16, 17, 18]
        os: [ubuntu-22.04]
        include:
          - os: ubuntu-24.04-arm
            arch: arm64
            pg_version: 17
          - os: macos-14
            arch: arm64
            pg_version: 16

    steps:
    - uses: actions/checkout@v4

    # --- Linux Setup ---
    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        set -euo pipefail
        PG_MAJOR="${{ matrix.pg_version }}"
        PG_BIN="/usr/lib/postgresql/${PG_MAJOR}/bin"

        # Add PGDG repo
        sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
        wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
        sudo apt-get update
        sudo apt-get install -y postgresql-${PG_MAJOR} postgresql-client-${PG_MAJOR} postgresql-server-dev-${PG_MAJOR} curl unzip build-essential

        # Prefer the matrix major for pg_config/psql/pg_isready
        echo "${PG_BIN}" >> "$GITHUB_PATH"
        export PATH="${PG_BIN}:$PATH"

        # Stop non-matrix clusters so port 5432 is unambiguous
        if command -v pg_lsclusters >/dev/null 2>&1; then
          while read -r ver name port status rest; do
            case "$ver" in
              Ver|"") continue ;;
            esac
            if [ "$ver" != "$PG_MAJOR" ]; then
              sudo pg_ctlcluster "$ver" "$name" stop || true
            fi
          done < <(pg_lsclusters)
        fi

        # Ensure the matrix cluster exists and listens on 5432 with password auth
        if ! pg_lsclusters | awk -v v="$PG_MAJOR" '$1 == v && $2 == "main" { found=1 } END { exit !found }'; then
          sudo pg_createcluster "$PG_MAJOR" main --port=5432
        fi
        CONF="/etc/postgresql/${PG_MAJOR}/main/postgresql.conf"
        HBA="/etc/postgresql/${PG_MAJOR}/main/pg_hba.conf"
        sudo sed -i "s/^#\?port\s*=.*/port = 5432/" "$CONF"
        if ! sudo grep -qE '^[[:space:]]*host[[:space:]]+all[[:space:]]+all[[:space:]]+127\.0\.0\.1/32[[:space:]]+md5' "$HBA"; then
          echo 'host all all 127.0.0.1/32 md5' | sudo tee -a "$HBA" >/dev/null
        fi
        if ! sudo grep -qE '^[[:space:]]*host[[:space:]]+all[[:space:]]+all[[:space:]]+::1/128[[:space:]]+md5' "$HBA"; then
          echo 'host all all ::1/128 md5' | sudo tee -a "$HBA" >/dev/null
        fi
        sudo pg_ctlcluster "$PG_MAJOR" main restart || sudo pg_ctlcluster "$PG_MAJOR" main start

        for i in $(seq 1 30); do
          pg_isready -h localhost -p 5432 && break
          sleep 1
        done
        pg_isready -h localhost -p 5432

        sudo -u postgres "${PG_BIN}/psql" -c "ALTER USER postgres PASSWORD 'postgres';"
        sudo -u postgres "${PG_BIN}/psql" -tc "SELECT 1 FROM pg_database WHERE datname = 'postgres'" | grep -q 1 \
          || sudo -u postgres "${PG_BIN}/createdb" -O postgres postgres

        echo "Active clusters:"
        pg_lsclusters
        echo "pg_config: $(command -v pg_config) ($(pg_config --version))"

    # --- macOS Setup ---

    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install postgresql@${{ matrix.pg_version }}
        brew services start postgresql@${{ matrix.pg_version }}
        
        # Link brew postgres path
        echo "/usr/local/opt/postgresql@${{ matrix.pg_version }}/bin" >> $GITHUB_PATH
        echo "/opt/homebrew/opt/postgresql@${{ matrix.pg_version }}/bin" >> $GITHUB_PATH
        
        # Wait for service
        sleep 5
        
        # Create user/db
        createdb postgres || true

    # --- Windows Setup ---
    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "Windows build is experimental."
        # Attempt to find if there's a way to build.
        # Without MSVC setup matching Postgres, this is likely to fail compilation.
        # We continue to at least test the 'download_libduckdb' script.

    # --- Common Steps ---
    - name: Download libduckdb (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: ./download_libduckdb.sh

    - name: Download libduckdb (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: .\download_libduckdb.ps1

    - name: Build and Install
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
           echo "Skipping build on Windows due to complexity of PGXS env setup."
           exit 0
        fi

        if [ "$RUNNER_OS" == "Linux" ]; then
          export PATH="/usr/lib/postgresql/${{ matrix.pg_version }}/bin:$PATH"
        fi
        echo "Building against: $(pg_config --version) ($(command -v pg_config))"

        make USE_PGXS=1
        sudo env "PATH=$PATH" make USE_PGXS=1 install || make USE_PGXS=1 install

    - name: Run Tests
      shell: bash
      env:
        PGPASSWORD: postgres
        PGUSER: postgres
        PGDATABASE: postgres
        PGHOST: localhost
        PGPORT: 5432
        TEST_PROFILE: ${{ github.event.inputs.test_profile || 'core' }}
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
           echo "Skipping tests on Windows."
           exit 0
        fi
        
        # macOS specific overrides (peer auth as the runner user)
        if [ "$RUNNER_OS" == "macOS" ]; then
           export PGUSER=$(whoami)
           export PGHOST="/tmp"
           export PGDATABASE="${PGDATABASE:-postgres}"
           unset PGPASSWORD
           createdb "$PGDATABASE" 2>/dev/null || true
        fi

        # Ensure the target database exists (Linux apt packages usually ship "postgres")
        if [ "$RUNNER_OS" == "Linux" ]; then
           export PATH="/usr/lib/postgresql/${{ matrix.pg_version }}/bin:$PATH"
           export PGDATABASE="${PGDATABASE:-postgres}"
           echo "Testing against: $(psql --version) / $(pg_config --version)"
           PGPASSWORD="${PGPASSWORD:-postgres}" psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -tc "SELECT version();"
           PGPASSWORD="${PGPASSWORD:-postgres}" psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '${PGDATABASE}'" | grep -q 1 \
             || PGPASSWORD="${PGPASSWORD:-postgres}" createdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" "$PGDATABASE"
        fi
        
        if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
          TEST_PROFILE="core"
        fi

        ./run_tests.sh --profile "$TEST_PROFILE"
